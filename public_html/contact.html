    <section class="">
      <h2 class="contact-text">お問い合わせは下記のフォームに入力ください。</h2>
      <form
        id="contact-form"
        class="contact-form"
        action="send_mail.php"
        method="POST"
      >
        <div class="form-group">
          <label for="name">お名前 <span class="required">*</span></label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="furigana">フリガナ <span class="required">*</span></label>
          <input type="text" id="furigana" name="furigana" required />
        </div>
        <div class="form-group">
          <label for="email"
            >メールアドレス <span class="required">*</span></label
          >
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label>お問い合わせ種別 <span class="required">*</span></label>
          <div class="radio-group">
            <input
              type="radio"
              id="education"
              name="inquiry_type"
              value="教育コンサルティング"
              required
            />
            <label for="education"
              >教育コンサルティングに関するお問い合わせ</label
            >
          </div>
          <div class="radio-group">
            <input
              type="radio"
              id="education"
              name="inquiry_type"
              value="教育コンサルティング"
              required
            />
            <label for="education"
              >フリーランスエンジニア支援サービスに関するお問い合わせ</label
            >
          </div>
          <div class="radio-group">
            <input
              type="radio"
              id="web_production"
              name="inquiry_type"
              value="Web制作"
            />
            <label for="web_production">Web制作に関するお問い合わせ</label>
          </div>
          <div class="radio-group">
            <input
              type="radio"
              id="web_application"
              name="inquiry_type"
              value="Webアプリケーション開発"
            />
            <label for="web_application"
              >Webアプリケーション開発に関するお問い合わせ</label
            >
          </div>
        </div>
        <div class="form-group">
          <label for="message"
            >お問い合わせ内容 <span class="required">*</span></label
          >
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="submit-btn">送信</button>
      </form>
